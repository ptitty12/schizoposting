# Deployed by Dokploy (project "schizoposting"). Domains + Traefik labels are added by Dokploy at deploy time.
# Secrets (FLASK_SECRET_KEY, OPENAI_API_KEY) come from the Environment tab in Dokploy.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=sqlite:////app/app.db
    volumes:
      # live data lives outside the checkout so redeploys keep it
      - /root/projects/_data/schizoposting/app.db:/app/app.db
      - /root/projects/_data/schizoposting/uploads:/app/uploads
